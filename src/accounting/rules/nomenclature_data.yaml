# ========================================================================
# Nomenclature Data — NCT (Tunisian Accounting Standard)
# ========================================================================
# The "menu of valid terms" — source of truth for Tier 0/1/2/HITL.
# Schema: §19 of nomenclature_revamp_plan.md
#
# Line-item codes (classes 1-7) follow NCT account plan.
#   Classes 1-5 → Bilan (10-14 Capitaux Propres, 15-18 Passifs NC, 21-29
#                        Immobilisations/Actifs NC, 31-39 Stocks,
#                        40-49 Tiers, 50-59 Financiers courants)
#   Classes 6-7 → Compte de Resultat
# ========================================================================

meta:
  standard: NCT
  version: "1.0"
  source: "context/Documentation/Nomenclature-et-Fonctionnement-des-comptes.pdf"

# ------------------------------------------------------------------------
# Column models (§15, §19, §27)
# ------------------------------------------------------------------------
column_models:
  brut_amort_net:
    columns: [brut, amortissement, net, n_minus_1]
    arithmetic_rule: "brut - amortissement == net"
    applies_to: [bilan_actif]
    header_keywords:
      brut: [Brut, "Montant brut", "Valeur brute"]
      amortissement: [Amort, Amortissement, "Amort. et prov.", "Dépréc", Provisions]
      net: [Net, "Valeur nette", "Valeur nette comptable"]
      n_minus_1: [N-1, "Exercice N-1", "Année précédente"]
  n_n1:
    columns: [value_n, value_n_minus_1]
    arithmetic_rule: null
    applies_to: [bilan_passif, compte_resultat, flux_tresorerie]
    header_keywords:
      value_n: [N, "Exercice N"]
      value_n_minus_1: [N-1, "Exercice N-1"]

# ------------------------------------------------------------------------
# Section hierarchy — which sections belong to each statement/sub_type
# ------------------------------------------------------------------------
sections:
  # Bilan Actif
  actifs_non_courants:
    statement_type: bilan
    sub_type: actif
    order: 1
    label_canonical: "Actifs non courants"
    subtotal_field: total_actifs_non_courants
  actifs_courants:
    statement_type: bilan
    sub_type: actif
    order: 2
    label_canonical: "Actifs courants"
    subtotal_field: total_actifs_courants
  # Bilan Passif
  capitaux_propres:
    statement_type: bilan
    sub_type: passif
    order: 3
    label_canonical: "Capitaux propres"
    subtotal_field: total_capitaux_propres
  passifs_non_courants:
    statement_type: bilan
    sub_type: passif
    order: 4
    label_canonical: "Passifs non courants"
    subtotal_field: total_passifs_non_courants
  passifs_courants:
    statement_type: bilan
    sub_type: passif
    order: 5
    label_canonical: "Passifs courants"
    subtotal_field: total_passifs_courants
  # Compte de Resultat
  produits_exploitation:
    statement_type: compte_resultat
    sub_type: null
    order: 1
    label_canonical: "Produits d'exploitation"
    subtotal_field: total_produits_exploitation
  charges_exploitation:
    statement_type: compte_resultat
    sub_type: null
    order: 2
    label_canonical: "Charges d'exploitation"
    subtotal_field: total_charges_exploitation
  resultat_operationnel:
    statement_type: compte_resultat
    sub_type: null
    order: 3
    label_canonical: "Résultat d'exploitation"
    subtotal_field: resultat_exploitation
  produits_charges_financiers:
    statement_type: compte_resultat
    sub_type: null
    order: 4
    label_canonical: "Produits et charges financiers"
    subtotal_field: resultat_financier
  produits_charges_extraordinaires:
    statement_type: compte_resultat
    sub_type: null
    order: 5
    label_canonical: "Éléments extraordinaires"
    subtotal_field: resultat_extraordinaire
  # Flux de Trésorerie (§27)
  flux_exploitation:
    statement_type: flux_tresorerie
    sub_type: null
    order: 1
    label_canonical: "Flux de trésorerie liés aux activités d'exploitation"
    subtotal_field: flux_net_exploitation
  flux_investissement:
    statement_type: flux_tresorerie
    sub_type: null
    order: 2
    label_canonical: "Flux de trésorerie liés aux activités d'investissement"
    subtotal_field: flux_net_investissement
  flux_financement:
    statement_type: flux_tresorerie
    sub_type: null
    order: 3
    label_canonical: "Flux de trésorerie liés aux activités de financement"
    subtotal_field: flux_net_financement

