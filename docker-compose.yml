# FinAlze backend — full stack. The GPU worker (Tier-2 VLM) is opt-in via `--profile gpu`.
#   docker compose up -d --build
#   docker compose --profile gpu up -d   # later, when Tier-2 lands
name: finalze

x-app-env: &app-env
  FINALZE_DATABASE_URL: postgresql+asyncpg://finalze:finalze@postgres:5432/finalze
  FINALZE_REDIS_URL: redis://redis:6379/0
  FINALZE_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
  FINALZE_RESULT_BACKEND_URL: redis://redis:6379/1
  FINALZE_S3_ENDPOINT_URL: http://minio:9000
  FINALZE_S3_ACCESS_KEY: minioadmin
  FINALZE_S3_SECRET_KEY: minioadmin
  FINALZE_S3_BUCKET: finalze-documents
  FINALZE_SECRET_KEY: ${FINALZE_SECRET_KEY:-dev-secret-change-me-openssl-rand-hex-32}
  FINALZE_ALLOWED_ORIGINS: '["http://localhost:8501","http://localhost"]'

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: finalze, POSTGRES_PASSWORD: finalze, POSTGRES_DB: finalze}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finalze -d finalze"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 12}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["15672:15672"]
    volumes: ["rabbitmqdata:/var/lib/rabbitmq"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 12}

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      <<: *app-env
      FINALZE_ADMIN_EMAIL: ${FINALZE_ADMIN_EMAIL:-admin@finalze.io}   # avoid reserved .local TLD (email-validator rejects it)
      FINALZE_ADMIN_PASSWORD: ${FINALZE_ADMIN_PASSWORD:-changeme-admin-pw}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    labels:
      - traefik.enable=true
      - traefik.http.routers.finalze.rule=PathPrefix(`/`)
      - traefik.http.routers.finalze.entrypoints=web
      - traefik.http.services.finalze.loadbalancer.server.port=8000

  worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}

  flower:
    build: {context: ., dockerfile: Dockerfile.api}   # slim image has celery+flower
    command: ["celery", "-A", "worker.celery_app", "flower", "--port=5555"]
    environment: *app-env
    ports: ["5555:5555"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}

  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports: ["8000:80", "8080:8080"]   # API via http://localhost:8000 ; dashboard :8080
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    depends_on: [api]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

  # Tier-2 GPU worker — opt-in (`--profile gpu`). Pair with a vLLM service serving Qwen2.5-VL.
  worker-gpu:
    profiles: ["gpu"]
    build: {context: ., dockerfile: Dockerfile.worker}
    command: ["celery", "-A", "worker.celery_app", "worker", "-Q", "ocr.gpu", "--pool=prefork", "--concurrency=1"]
    environment: *app-env
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
